name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name ConturMarketHotkeys ConturMarketHotkeys_v2/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ConturMarketHotkeys-Windows-v3
          path: dist/ConturMarketHotkeys.exe
